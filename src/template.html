const CATEGORY_ORDER = {
  qatal: { singular: ["1cs", "2ms", "2fs", "3ms", "3fs"], plural: ["1cp", "2mp", "2fp", "3cp"] },
  yiqtol: { singular: ["1cs", "2ms", "2fs", "3ms", "3fs"], plural: ["1cp", "2mp", "2fp", "3mp", "3fp"] },
  participle: { singular: ["ms", "fs"], plural: ["mp", "fp"] },
  imperative: { singular: ["2ms", "2fs"], plural: ["2mp", "2fp"] },
};
const FORM_CATEGORY = {
  perfect: "qatal", veqatal: "qatal", wayyiqtol: "yiqtol", yiqtol: "yiqtol",
  participle_active: "participle", participle_passive: "participle", imperative: "imperative",
  cohortative: "yiqtol", jussive: "yiqtol",
  infinitive_construct: "infinitive", infinitive_absolute: "infinitive",
};
const BASE_FORM_META = [
  { key: "perfect", label: "Qatal", sub: "Perfect" },
  { key: "wayyiqtol", label: "Wayyiqtol", sub: "Vav-consec. (narrative)" },
  { key: "yiqtol", label: "Yiqtol", sub: "Imperfect" },
  { key: "veqatal", label: "Veqatal", sub: "Vav-consec. (sequential)" },
  { key: "imperative", label: "Tsivvui", sub: "Imperative" },
  { key: "infinitive_construct", label: "Makor Natuy", sub: "Infinitive Construct" },
  { key: "infinitive_absolute", label: "Makor Muchlat", sub: "Infinitive Absolute" },
  { key: "cohortative", label: "Cohortative", sub: "Volitive · 1st" },
  { key: "jussive", label: "Jussive", sub: "Volitive · 3rd" },
];

function buildFormMeta(stemEntry) {
  const hasActive = !!stemEntry.forms.participle_active;
  const hasPassive = !!stemEntry.forms.participle_passive;
  let participleSpokes;
  if (hasActive && hasPassive) {
    participleSpokes = [
      { key: "participle_active", label: "Qotel", sub: "Active Participle" },
      { key: "participle_passive", label: "Qatul", sub: "Passive Participle" },
    ];
  } else if (hasActive) {
    participleSpokes = [{ key: "participle_active", label: "Beinoni", sub: "Participle" }];
  } else if (hasPassive) {
    participleSpokes = [{ key: "participle_passive", label: "Beinoni", sub: "Participle" }];
  } else {
    participleSpokes = [{ key: "participle_active", label: "Beinoni", sub: "Participle" }];
  }
  return [BASE_FORM_META[0], BASE_FORM_META[1], ...participleSpokes, ...BASE_FORM_META.slice(2)];
}

function splitForm(formKey, entries) {
  const cat = FORM_CATEGORY[formKey];
  if (cat === "infinitive") return { invariant: entries };
  const order = CATEGORY_ORDER[cat];
  const byCode = Object.fromEntries(entries.map((e) => [e.code, e]));
  return {
    singular: order.singular.map((c) => byCode[c]).filter(Boolean),
    plural: order.plural.map((c) => byCode[c]).filter(Boolean),
  };
}

function firstAvailableStem(rootEntry, root) {
  const override = root && DEFAULT_STEM_OVERRIDE[root];
  if (override && rootEntry.stems[override]) return override;
  return STEM_ORDER.find((s) => rootEntry.stems[s]) || Object.keys(rootEntry.stems)[0];
}
function firstAvailableForm(stemEntry) {
  const formMeta = buildFormMeta(stemEntry);
  return formMeta.find((f) => stemEntry.forms[f.key])?.key || Object.keys(stemEntry.forms)[0];
}
function pickRepresentativeRow(rows) {
  return rows.find((r) => r.code === "3ms") || rows.find((r) => r.code === "ms") || rows[0];
}
function stemGloss(rootEntry, stem, category) {
  // form_glosses[category] takes priority over stem_glosses when the
  // currently displayed form's category has its own override (e.g. גרש
  // Qal: 'drive out' generally, but the passive participle is the fixed
  // legal term 'divorced (woman)'). Kept in sync with template.jsx.
  const stemEntry = rootEntry.stems[stem];
  const formOverride = category && stemEntry && stemEntry.form_glosses && stemEntry.form_glosses[category];
  return formOverride || (rootEntry.stem_glosses && rootEntry.stem_glosses[stem]) || rootEntry.glosses[0];
}

/* ---------------------------------------------------------------
   STATE
------------------------------------------------------------------ */
let state = { query: "", notFound: false, activeRoot: null, activeStem: null, activeForm: null };

function loadRoot(root) {
  const entry = VERB_DATA[root];
  const stem = firstAvailableStem(entry, root);
  state.activeRoot = root;
  state.activeStem = stem;
  state.activeForm = null;
  state.notFound = false;
  render();
}
function handleSearch() {
  const q = state.query.trim().toLowerCase();
  if (!q) return;
  // exact match first; fall back to whole-word-boundary match, not raw
  // substring containment (which would let "do" match inside "dover").
  let hit = VERB_INDEX.find((entry) => entry.match.some((m) => m === q));
  if (!hit) {
    const re = new RegExp("\\b" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b");
    hit = VERB_INDEX.find((entry) => entry.match.some((m) => re.test(m)));
  }
  if (hit) loadRoot(hit.root);
  else { state.notFound = true; render(); }
}

const UNITLESS_STYLE_PROPS = new Set([
  "opacity", "zIndex", "fontWeight", "lineHeight", "flex", "flexGrow", "flexShrink", "order", "zoom",
]);
function el(tag, styleObj, props) {
  const e = document.createElement(tag);
  if (styleObj) {
    for (const k in styleObj) {
      let v = styleObj[k];
      if (typeof v === "number" && !UNITLESS_STYLE_PROPS.has(k)) v = v + "px";
      e.style[k] = v;
    }
  }
  if (props) Object.assign(e, props);
  return e;
}
function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

------------------------------------------------------------------ */
const root = document.getElementById("root");

function render() {
  clear(root);
  const page = el("div", styles.page);

  const header = el("header", styles.header);
  const eyebrow = el("p", styles.eyebrow); eyebrow.textContent = "מַפַּת הַפֹּעַל · Hebrew Verb Map";
  const title = el("h1", styles.title); title.textContent = "Paradigm explorer";
  const subtitle = el("p", styles.subtitle);
  subtitle.textContent = Object.keys(VERB_DATA).length + " roots · attested Biblical Hebrew forms only (Open Scriptures Hebrew Bible)";
  header.append(eyebrow, title, subtitle);
  page.appendChild(header);

  const searchRow = el("div", styles.searchRow);
  const input = el("input", styles.input, {
    placeholder: "Try: go · give · shamar · קרא · reign · make king",
    value: state.query,
  });
  input.addEventListener("input", (e) => { state.query = e.target.value; state.notFound = false; });
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") handleSearch(); });
  const searchBtn = el("button", styles.searchBtn, { type: "button", textContent: "Find" });
  searchBtn.addEventListener("click", handleSearch);
  searchRow.append(input, searchBtn);
  page.appendChild(searchRow);

  if (state.notFound) {
    const nf = el("p", styles.notFound);
    nf.textContent = "Not in the database. Try an English gloss, a transliteration, or the Hebrew root.";
    page.appendChild(nf);
  }

  // root picker
  const pickerBox = el("div", styles.rootPickerBox);
  const pickerTitle = el("span", styles.legendTitle);
  pickerTitle.textContent = "Roots (" + Object.keys(VERB_DATA).length + ")";
  const pickerRow = el("div", styles.rootPickerRow);
  ROOT_ORDER.forEach((r) => {
    const chip = el("button", {
      ...styles.rootChip,
      background: r === state.activeRoot ? "#2B2018" : "#FBF6EC",
      color: r === state.activeRoot ? "#F4EEDF" : "#2B2018",
    }, { title: VERB_DATA[r].glosses.join(", ") });
    const heb = el("span", styles.rootChipHeb); heb.textContent = r;
    const gloss = el("span", { ...styles.rootChipGloss, color: r === state.activeRoot ? "#D9CDB0" : "#8A7F6A" });
    gloss.textContent = ROOT_CITATION_TRANSLIT[r];
    chip.append(heb, gloss);
    chip.addEventListener("click", () => loadRoot(r));
    pickerRow.appendChild(chip);
  });
  pickerBox.append(pickerTitle, pickerRow);
  page.appendChild(pickerBox);

  if (!state.activeRoot) {
    const hint = el("p", styles.placeholderHint);
    hint.textContent = "Pick a root above, or search, to open its paradigm wheel.";
    page.appendChild(hint);
    renderFooter(page);
    root.appendChild(page);
    return;
  }

  const rootEntry = VERB_DATA[state.activeRoot];
  const stemEntry = rootEntry.stems[state.activeStem];
  const stemColor = STEM_COLOR[state.activeStem];
  const formMeta = buildFormMeta(stemEntry);

  // legend
  const legendBox = el("div", styles.legendBox);
  const legendTitle = el("span", styles.legendTitle);
  legendTitle.textContent = "Binyan legend — " + rootEntry.glosses[0] + " (" + state.activeRoot + ")";
  const legendRow = el("div", styles.legendRow);
  STEM_ORDER.forEach((key) => {
    const meta = STEM_COLOR[key];
    const available = !!rootEntry.stems[key];
    const chip = el("button", {
      ...styles.legendChip,
      borderColor: meta.color,
      color: available ? meta.color : "#9C9284",
      background: state.activeStem === key ? meta.color : "transparent",
      opacity: available ? 1 : 0.5,
      cursor: available ? "pointer" : "not-allowed",
    }, { disabled: !available, title: available ? "View " + meta.name : meta.name + " not attested for " + state.activeRoot });
    const dot = el("span", { ...styles.legendDot, background: state.activeStem === key ? "#FBF6EC" : meta.color });
    chip.appendChild(dot);
    chip.appendChild(document.createTextNode(meta.name + (available ? "" : " †")));
    if (available) chip.addEventListener("click", () => {
      state.activeStem = key; state.activeForm = null; render();
    });
    legendRow.appendChild(chip);

  legendBox.append(legendTitle, legendRow);
  const legendFoot = el("span", styles.legendFootnote);

  page.appendChild(legendBox);

  // wheel section
  const wheelSection = el("section", styles.wheelSection);

  if (!state.activeForm) {
    const wheelWrap = el("div", styles.wheelWrap);
    const spokesLayer = el("div", styles.spokesLayer);

        ...styles.spoke,
        transform: "rotate(" + (deg + 90) + "deg)",
        background: "linear-gradient(90deg, " + stemColor.color + "55, transparent)",

    const ctr = el("span", styles.centerTranslit); ctr.textContent = repRow.translit;

    const csense = el("span", styles.centerSense); csense.textContent = stemEntry.sense_hint;
    centerCard.append(csl, cheb, ctr, ceng, csense);
    wheelWrap.appendChild(centerCard);

    formMeta.forEach((f, i) => {
      const deg = angles[i];
      const rad = (deg * Math.PI) / 180;
      const radius = 190;
      const x = Math.cos(rad) * radius;
      const y = Math.sin(rad) * radius;
      const available = !!stemEntry.forms[f.key];
      const btn = el("button", {
        ...styles.formBtn,
        left: "calc(50% + " + x + "px)",

    const cheb2 = el("span", styles.centerHebSmall); cheb2.textContent = repRow.heb;
    const ctr2 = el("span", styles.centerTranslit); ctr2.textContent = repRow.translit;
    centerFlat.append(csl2, cheb2, ctr2);
    expandedWrap.appendChild(centerFlat);

    const tabStrip = el("div", styles.tabStrip);
    formMeta.forEach((f) => {
      const available = !!stemEntry.forms[f.key];
      const isActive = f.key === state.activeForm;
      const tab = el("button", {
        ...styles.tabBtn,
        borderColor: available ? stemColor.color : "#C9BB98",
        background: isActive ? stemColor.color : "transparent",
        color: isActive ? "#FBF6EC" : available ? stemColor.color : "#B7AC94",
        opacity: available ? 1 : 0.5,
        cursor: available ? "pointer" : "not-allowed",
      }, { disabled: !available });
      const tl = el("span", styles.tabBtnLabel); tl.textContent = f.label;
      const ts = el("span", styles.tabBtnSub); ts.textContent = f.sub;
      tab.append(tl, ts);
      if (available) tab.addEventListener("click", () => { state.activeForm = f.key; render(); });
      tabStrip.appendChild(tab);
    });
    expandedWrap.appendChild(tabStrip);

    const columnsWrap = el("div", styles.columnsWrap);
    const split = splitForm(state.activeForm, stemEntry.forms[state.activeForm]);
    if (split.invariant) {
      const iw = el("div", styles.invariantWrap);
      split.invariant.forEach((row) => iw.appendChild(wordCard(row, stemColor.color, stemGloss(rootEntry, state.activeStem, state.activeForm))));
      columnsWrap.appendChild(iw);
    } else {
      const colS = el("div", styles.column);
      const colSTitle = el("span", { ...styles.columnTitle, color: stemColor.color }); colSTitle.textContent = "Singular";
      const colSCards = el("div", styles.columnCards);
      split.singular.forEach((row) => colSCards.appendChild(wordCard(row, stemColor.color, stemGloss(rootEntry, state.activeStem, state.activeForm))));
      colS.append(colSTitle, colSCards);

      const colP = el("div", styles.column);
      const colPTitle = el("span", { ...styles.columnTitle, color: stemColor.color }); colPTitle.textContent = "Plural";
      const colPCards = el("div", styles.columnCards);
      split.plural.forEach((row) => colPCards.appendChild(wordCard(row, stemColor.color, stemGloss(rootEntry, state.activeStem, state.activeForm))));
      colP.append(colPTitle, colPCards);

      columnsWrap.append(colS, colP);
    }
    expandedWrap.appendChild(columnsWrap);
    wheelSection.appendChild(expandedWrap);
  }

  page.appendChild(wheelSection);
  renderFooter(page);
  root.appendChild(page);
}

function wordCard(row, color, gloss) {
  const card = el("div", { ...styles.wordCard, borderTopColor: color });
  const topRow = el("div", styles.cardTopRow);
  const slot = el("span", styles.cardSlot); slot.textContent = row.label;
  const badgeGroup = el("span", styles.badgeGroup);
  if (row.has_prefix) {
    const b = el("span", styles.prefixBadge, { title: "No form of this exact slot without an attached conjunction/article/preposition occurs anywhere in the Bible." });
    b.textContent = "+ prefix";
    badgeGroup.appendChild(b);
  }
  if (row.has_suffix) {
    const b = el("span", styles.suffixBadge, { title: "No bare (unsuffixed) form of this exact slot occurs anywhere in the Bible — this attested form carries an attached pronominal object suffix." });
    b.textContent = "+ suffix";
    badgeGroup.appendChild(b);
  }
  topRow.append(slot, badgeGroup);
  const heb = el("span", styles.cardHeb); heb.textContent = row.heb;
  const tr = el("span", styles.cardTranslit); tr.textContent = row.translit;
  const eng = el("span", styles.cardEng); eng.textContent = gloss + " · " + row.ref;
  card.append(topRow, heb, tr, eng);
  return card;
}

function renderFooter(page) {
  const footer = el("footer", styles.footer);
  const p = el("p");
  p.textContent = Object.keys(VERB_DATA).length + " roots, every form pulled from actual attested occurrences in the Hebrew Bible (Open Scriptures Hebrew Bible morphology + Westminster Leningrad Codex text). Gaps are real gaps — if a form doesn't occur in Scripture, it isn't shown. Vowel points (niqqud) included; cantillation marks removed for readability.";
  footer.appendChild(p);
  page.appendChild(footer);
}

render();

</script>
